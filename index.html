<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><link rel="stylesheet" type="text/css" href="cid:css-3893dca2-71ff-436b-9b1b-404f0fb9ea7e@mhtml.blink" />

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Me To You</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Caveat:wght@400..700&amp;family=Quicksand:wght@400..700&amp;display=swap" rel="stylesheet">

</head>
<body>

<!-- ============ 1) LOCK PAGE ============ -->
<section id="page-lock" class="page active">
  <div class="center">
    <h1 class="script">From me to you.</h1>
    <p class="hand" style="font-size:1.3rem;color:var(--muted)">This is how much I love you.</p>
    <button class="lock" id="lockBtn" aria-label="unlock">
      <svg viewBox="0 0 24 24" class="beat"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 118 0v3"></path></svg>
      <div class="hand" style="color:var(--muted);font-size:1.1rem">tap the lock</div>
    </button>
  </div>
</section>

<!-- ============ 2) PHOTOS + LETTER ============ -->
<section id="page-gallery" class="page">
  <h2 class="script" style="font-size:2.3rem;margin:6px 0">Our little gallery</h2>
  <p class="hand" style="color:var(--muted);margin:0">drag the pictures around with your finger</p>
  <div id="board"></div>

  <h2 class="script" style="font-size:2.3rem">i love you <span class="beat">❤️</span></h2>
  <div class="sheet"><p id="letter"></p></div>
  <p class="script" style="font-size:2.1rem">my eyes will always adore you <span class="beat">❤️</span></p>

  <button class="btn" id="nextBtn">Next →</button>
</section>

<!-- ============ 3) LAST PAGE ============ -->
<section id="page-final" class="page">
  <div class="center">
    <div class="beat" style="font-size:5rem">🫀</div>
    <h1 class="script" style="margin-top:24px">I LOVE YOU 😘</h1>
    <p class="hand" style="font-size:1.3rem;color:var(--muted)">Forever &amp; always</p>
    <button class="btn" style="background:none;color:var(--muted)" id="backBtn">← go back</button>
  </div>
</section>

<!-- ============ PASSKEY PAD ============ -->
<div id="padWrap">
  <div class="pad">
    <div class="script" style="font-size:1.6rem;text-align:center">our little secret</div>
    <div class="dots" id="dots"></div>
    <div class="keys" id="keys"></div>
    <div id="padMsg" class="hand" style="text-align:center;color:var(--primary);height:22px;margin-top:8px"></div>
  </div>
</div>

<!-- ============ MUSIC ============ -->
<!-- apna gaana yahan rakho: music/song.mp3 -->
<audio id="song" src="https://id-preview--c5d816a9-2fb7-468f-8b30-291fc2df0b61.lovable.app/__l5e/documents/music/song.mp3" loop=""></audio>
<button class="music" id="musicBtn" style="display:none">♪</button>

</body>
</html>
